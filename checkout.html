<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Apodaca Music</title>
  <style>
    body {
      background-color: black;
      color: yellow;
      font-family: "Courier New", monospace;
      padding: 20px;
      text-align: center;
    }
    h1 {
      text-shadow: 2px 2px red;
      font-size: 1.8em;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 10px 0;
    }
    li {
      background-color: darkred;
      margin: 5px auto;
      padding: 10px;
      border: 1px solid yellow;
      max-width: 90%;
      box-sizing: border-box;
    }
    .metodos-pago {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 30px auto;
      flex-wrap: wrap;
    }
    .metodos-pago img {
      height: 40px;
      object-fit: contain;
      background-color: transparent;
      filter: drop-shadow(1px 1px 2px black);
    }
    .formulario {
      background-color: #222;
      border: 1px solid yellow;
      padding: 15px;
      margin: 20px auto;
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
      text-align: left;
    }
    .formulario label {
      display: block;
      margin: 10px 0 5px;
      font-size: 0.9em;
    }
    .formulario input {
      width: 100%;
      padding: 8px;
      border: none;
      background-color: #333;
      color: yellow;
      font-family: inherit;
      box-sizing: border-box;
      font-size: 1em;
    }
    button {
      background-color: lime;
      color: black;
      font-weight: bold;
      border: none;
      padding: 12px 20px;
      margin-top: 20px;
      cursor: pointer;
      font-size: 1em;
    }
    p {
      margin: 5px 0;
      font-size: 1em;
    }
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      h1 {
        font-size: 1.5em;
      }
      .metodos-pago img {
        height: 30px;
        margin: 5px;
      }
      .formulario {
        padding: 10px;
      }
      button {
        width: 100%;
        padding: 10px;
      }
      li {
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>

  <h1>🧾 Checkout Apodaca Music</h1>

  <h3>Productos en tu carrito:</h3>
  <ul id="lista-checkout"></ul>
  <p><strong>Total: $<span id="total-checkout">0</span> MXN</strong></p>

  <div class="metodos-pago">
    <img src="https://companieslogo.com/img/orig/V.D-e36aebe0.png?t=1720244494" alt="Visa">
    <img src="https://1000marcas.net/wp-content/uploads/2019/12/logo-Mastercard.png" alt="MasterCard">
    <img src="https://static-00.iconduck.com/assets.00/amex-icon-2048x1286-jssggdy1.png" alt="American Express">
    <img src="https://static-00.iconduck.com/assets.00/applepay-icon-2048x842-s5plnamg.png" alt="Apple Pay">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/Google_Pay_Acceptance_Mark.svg/640px-Google_Pay_Acceptance_Mark.svg.png" alt="Google Pay">
  </div>

 <form class="formulario" id="checkout-form">
  <label for="nombre">Nombre completo:</label>
  <input type="text" name="nombre" id="nombre" placeholder="Tu nombre completo" required>

  <label for="email">Correo electrónico:</label>
  <input type="email" name="email" id="email" placeholder="tu@correo.com" required>

  <label for="direccion">Dirección de envío:</label>
  <input type="text" name="direccion" id="direccion" placeholder="Calle, número, colonia, ciudad" required>

  <input type="hidden" name="detalle" id="detalle">

  <button type="submit">Finalizar Compra</button>
</form>

<p id="mensaje" style="margin-top:20px; font-weight: bold; font-size:1em;"></p>

<script>
  const carrito = JSON.parse(localStorage.getItem('carritoApodaca')) || [];
  let total = 0;
  const lista = document.getElementById('lista-checkout');
  const detalle = [];

  carrito.forEach(item => {
    const li = document.createElement('li');
    li.textContent = `${item.producto} – $${item.precio} MXN`;
    lista.appendChild(li);
    total += item.precio;
    detalle.push(`${item.producto} – $${item.precio} MXN`);
  });

  document.getElementById('total-checkout').textContent = total;

  document.getElementById('checkout-form').addEventListener('submit', function (event) {
    event.preventDefault();

    const nombre = document.getElementById('nombre').value.trim();
    const email = document.getElementById('email').value.trim();
    const dir = document.getElementById('direccion').value.trim();
    const resumen = detalle.join('\n') + `\nTotal: $${total} MXN`;

    if (!nombre || !email || !dir) {
      alert('Por favor, completa todos los campos antes de enviar.');
      return;
    }

    const formData = new FormData();
    formData.append("nombre", nombre);
    formData.append("email", email);
    formData.append("direccion", dir);
    formData.append("detalle", resumen);

    fetch("https://formspree.io/f/xdkgeorl", {
      method: "POST",
      body: formData,
      headers: {
        'Accept': 'application/json'
      }
    })
    .then(response => {
      if (response.ok) {
        document.getElementById('mensaje').textContent = 
          `✅ Su compra ha sido confirmada con éxito. Gracias, ${nombre}. Pronto le enviaremos la información de envío a ${email}.`;
        localStorage.removeItem('carritoApodaca');
        document.getElementById('checkout-form').reset();
      } else {
        document.getElementById('mensaje').textContent = "❌ Hubo un error al enviar el formulario. Inténtalo de nuevo.";
      }
    })
    .catch(error => {
      console.error('Error:', error);
      document.getElementById('mensaje').textContent = "❌ Error al enviar. Inténtalo más tarde.";
    });
  });
</script>
