<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Checkout Apodaca Music</title>
  <style>
    body {
      background-color: black;
      color: yellow;
      font-family: "Courier New", monospace;
      padding: 20px;
      text-align: center;
    }
    h1 {
      text-shadow: 2px 2px red;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background-color: darkred;
      margin: 5px;
      padding: 10px;
      border: 1px solid yellow;
    }
    .logos img {
      width: 60px;
      height: 60px;
      margin: 10px;
      border: 1px solid yellow;
      padding: 5px;
      background-color: transparent;
    }
    .formulario {
      background-color: #222;
      border: 1px solid yellow;
      padding: 15px;
      margin: 20px auto;
      max-width: 400px;
      text-align: left;
    }
    .formulario label {
      display: block;
      margin: 10px 0 5px;
    }
    .formulario input {
      width: 100%;
      padding: 8px;
      border: none;
      background-color: #333;
      color: yellow;
      font-family: inherit;
    }
    button {
      background-color: lime;
      color: black;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🧾 Checkout Apodaca Music</h1>

  <h3>Productos en tu carrito:</h3>
  <ul id="lista-checkout"></ul>
  <p><strong>Total: $<span id="total-checkout">0</span> MXN</strong></p>

  <div class="logos">
    <img src="https://1000logos.net/wp-content/uploads/2017/06/VISA-Logo-1992.png" alt="Visa">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/MasterCard_early_1990s_logo.png/1200px-MasterCard_early_1990s_logo.png" alt="Mastercard">
    <img src="https://1000logos.net/wp-content/uploads/2016/10/American-Express-Logo-1975.png" alt="Amex">
    <img src="https://cdn-icons-png.flaticon.com/512/5968/5968279.png" alt="Apple Pay">
  </div>

  <div class="formulario">
    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" placeholder="tu@correo.com" required>

    <label for="direccion">Dirección de envío:</label>
    <input type="text" id="direccion" placeholder="Calle, número, colonia, ciudad" required>
  </div>

  <button onclick="confirmarCompra()">Finalizar Compra</button>

  <p id="mensaje" style="margin-top:20px; font-weight: bold;"></p>

  <script>
    const carrito = JSON.parse(localStorage.getItem('carritoApodaca')) || [];
    let total = 0;
    const lista = document.getElementById('lista-checkout');

    carrito.forEach(item => {
      const li = document.createElement('li');
      li.textContent = `${item.producto} – $${item.precio} MXN`;
      lista.appendChild(li);
      total += item.precio;
    });

    document.getElementById('total-checkout').textContent = total;

    function confirmarCompra() {
      const email = document.getElementById('email').value.trim();
      const dir = document.getElementById('direccion').value.trim();
      if (!email || !dir) {
        alert('Por favor, completa tu correo y dirección antes de finalizar la compra.');
        return;
      }
      document.getElementById('mensaje').textContent =
        '✅ Su compra ha sido confirmada con éxito. Pronto le enviaremos la información de envío a ' + email + '.';
      localStorage.removeItem('carritoApodaca');
    }
  </script>

</body>
</html>
