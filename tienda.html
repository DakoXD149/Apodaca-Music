<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Apodaca Music</title>
  <style>
    body {
      background-color: black;
      color: yellow;
      font-family: "Courier New", monospace;
      padding: 20px;
    }

    h1 {
      text-align: center;
      text-shadow: 2px 2px red;
    }

    .contenedor-productos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .producto {
      background-color: darkred;
      border: 2px solid yellow;
      padding: 15px;
      width: 250px;
      text-align: center;
    }

    .producto img {
      width: 100%;
      border: 2px solid yellow;
    }

    .carrito {
      background-color: #222;
      border: 2px solid lime;
      padding: 10px;
      margin-top: 30px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    button {
      background-color: yellow;
      color: black;
      font-weight: bold;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      margin-top: 10px;
    }

    @media screen and (max-width: 500px) {
      .producto {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <h1>Tienda Oficial Apodaca Music</h1>

  <div class="contenedor-productos">
    <div class="producto">
      <img src="https://github.com/DakoXD149/Apodaca-Music/blob/main/SG25.jpg?raw=true" alt="Cinta Said García">
      <p><strong>Said García – Los Mejores Éxitos</strong></p>
      <p>$130 MXN</p>
      <button onclick="agregarAlCarrito('Cinta Said García', 130)">Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="https://github.com/DakoXD149/Apodaca-Music/blob/main/HERE.JPG?raw=true" alt="Cassette Los Herederos de San Luis - Narcocorridos Vol. 1">
      <p><strong>Los Herederos de San Luis – Narcocorridos Vol. 1</strong></p>
      <p>$130 MXN</p>
      <button onclick="agregarAlCarrito('Los Herederos de San Luis – Narcocorridos Vol. 1', 130)">Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="https://m.media-amazon.com/images/I/B1pppR4gVKL._CLa%7C2140%2C2000%7C61inuPr5j9L.png%7C0%2C0%2C2140%2C2000%2B0.0%2C0.0%2C2140.0%2C2000.0_AC_UY1000_.png" alt="Camiseta">
      <p><strong>Camiseta “Hecho en Nuevo León”</strong></p>
      <p>$200 MXN</p>
      <button onclick="agregarAlCarrito('Camiseta Hecho en Nuevo León', 200)">Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="https://site-product.innovasport.com/img-test/21071503808/21071503808_2-1200x1200.jpg" alt="Termo">
      <p><strong>Termo 30oz</strong></p>
      <p>$350 MXN</p>
      <button onclick="agregarAlCarrito('Termo 30oz', 350)">Agregar al carrito</button>
    </div>
  </div>

  <div class="carrito">
    <h3>🛒 Carrito de Compras</h3>
    <ul id="lista-carrito"></ul>
    <p><strong>Total: $<span id="total">0</span> MXN</strong></p>
  </div>

  <div style="text-align: center; margin-top: 20px;">
    <a href="checkout.html">
      <button style="background-color: lime; color: black;">Ir al Checkout</button>
    </a>
  </div>

  <script>
    let carrito = [];
    let total = 0;

    function agregarAlCarrito(producto, precio) {
      carrito.push({ producto, precio });
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const lista = document.getElementById('lista-carrito');
      lista.innerHTML = '';
      total = 0;

      carrito.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.producto} – $${item.precio} MXN`;
        lista.appendChild(li);
        total += item.precio;
      });

      document.getElementById('total').textContent = total;
      localStorage.setItem('carritoApodaca', JSON.stringify(carrito));
    }
  </script>

</body>
</html>
